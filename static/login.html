<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>登入 | 旅行收據管家</title>
    <style>
        :root {
            --bg-primary: #0a0e1a;
            --bg-card: rgba(17, 24, 39, 0.8);
            --border-glass: rgba(255, 255, 255, 0.08);
            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
            --accent-danger: #ef4444;
            --gradient-primary: linear-gradient(135deg, #6366f1, #8b5cf6);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background: var(--bg-primary);
            background-image:
                radial-gradient(circle at 20% 0%, rgba(99, 102, 241, 0.18), transparent 45%),
                radial-gradient(circle at 80% 100%, rgba(139, 92, 246, 0.15), transparent 45%);
            color: var(--text-primary);
            font-family: 'Noto Sans TC', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }
        .card {
            width: 100%;
            max-width: 380px;
            padding: 36px 28px 30px;
            background: var(--bg-card);
            border: 1px solid var(--border-glass);
            border-radius: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(20px);
        }
        .logo { font-size: 40px; text-align: center; margin-bottom: 12px; }
        h1 { font-size: 20px; font-weight: 700; text-align: center; margin-bottom: 6px; }
        .subtitle {
            font-size: 13px; color: var(--text-secondary);
            text-align: center; margin-bottom: 26px;
        }
        label {
            display: block; font-size: 13px; font-weight: 500;
            color: var(--text-secondary); margin-bottom: 8px;
        }
        input[type="password"] {
            width: 100%; padding: 13px 15px; font-size: 16px;
            color: var(--text-primary);
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--border-glass);
            border-radius: 12px; outline: none;
            transition: border-color 0.2s, background 0.2s;
        }
        input[type="password"]:focus {
            border-color: rgba(99, 102, 241, 0.6);
            background: rgba(255, 255, 255, 0.07);
        }
        button {
            width: 100%; margin-top: 18px; padding: 14px;
            font-size: 15px; font-weight: 600; color: #fff;
            background: var(--gradient-primary);
            border: none; border-radius: 12px; cursor: pointer;
            transition: opacity 0.2s, transform 0.15s;
        }
        button:hover:not(:disabled) { transform: translateY(-1px); }
        button:disabled { opacity: 0.55; cursor: not-allowed; transform: none; }
        .error {
            margin-top: 14px; padding: 10px 12px;
            font-size: 13px; color: var(--accent-danger);
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.25);
            border-radius: 10px; text-align: center;
        }
        .hidden { display: none; }
        .hint {
            margin-top: 20px; font-size: 12px; line-height: 1.6;
            color: var(--text-muted); text-align: center;
        }
    </style>
</head>
<body>
    <main class="card">
        <div class="logo">✈️</div>
        <h1>旅行收據管家</h1>
        <p class="subtitle">請輸入密碼以繼續</p>

        <form id="login-form" autocomplete="on">
            <label for="password">密碼</label>
            <input type="password" id="password" name="password"
                   autocomplete="current-password" required autofocus>
            <button type="submit" id="submit-btn">登入</button>
            <div class="error hidden" id="error"></div>
        </form>

        <p class="hint">登入後這台裝置會保持登入狀態，<br>不需要每次重新輸入密碼。</p>
    </main>

    <script>
        const form = document.getElementById('login-form');
        const input = document.getElementById('password');
        const btn = document.getElementById('submit-btn');
        const errorBox = document.getElementById('error');

        function showError(msg) {
            errorBox.textContent = msg;
            errorBox.classList.remove('hidden');
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            errorBox.classList.add('hidden');
            btn.disabled = true;
            btn.textContent = '登入中...';

            try {
                const res = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ password: input.value }),
                });
                const data = await res.json();
                if (res.ok) {
                    window.location.replace('/');
                    return;
                }
                showError(data.error || `登入失敗 (HTTP ${res.status})`);
            } catch (err) {
                showError('無法連線到伺服器');
            }

            btn.disabled = false;
            btn.textContent = '登入';
            input.value = '';
            input.focus();
        });
    </script>
</body>
</html>
